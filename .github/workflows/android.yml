name: Luna Mar abierto (Android)

# Only this branch: the original Luna (main) has its own workflow and is never touched from here.
on:
  push:
    branches: [mar-abierto]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the game into the app
        run: python3 tools/build_assets.py

      - name: Build the test APK
        env:
          LUNAMAR_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: luna-mar-abierto-apk-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
