name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bundle the game into the app
        run: python3 tools/build_assets.py

      - name: Decode upload key
        env:
          KEYSTORE_B64: ${{ secrets.LUNA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # tolerate spaces or line breaks picked up when pasting the secret
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "LUNA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key file: $(wc -c < "$RUNNER_TEMP/upload.jks") bytes, sha256 starts $(sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-16)"
          else
            echo "::warning::No upload key in secrets: the release bundle will be unsigned."
          fi

      - name: Check upload key password
        if: env.LUNA_KEYSTORE != ''
        env:
          PW: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
        run: |
          # same cleanup as app/build.gradle.kts; only lengths are printed, never the values
          clean() { printf '%s' "$1" | sed -e 's/^[[:space:]`"'"'"']*//' -e 's/[[:space:]`"'"'"']*$//'; }
          P=$(clean "$PW"); A=$(clean "$ALIAS")
          echo "Password: ${#PW} characters as stored, ${#P} after cleanup. Alias: ${#A} characters."
          if ! keytool -list -keystore "$LUNA_KEYSTORE" -storepass "$P" -alias "$A" > /dev/null 2>&1; then
            echo "::error::The upload key could not be opened with LUNA_KEYSTORE_PASSWORD and LUNA_KEY_ALIAS. Check that both secrets match clave-de-subida/LEEME.md and that LUNA_KEYSTORE_B64 is the whole luna-upload.jks.b64.txt file."
            exit 1
          fi
          echo "Upload key opens correctly."

      - name: Build APK and bundle
        env:
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
          LUNA_VERSION_CODE: ${{ github.run_number }}
          LUNA_ADMOB_APP_ID: ${{ secrets.LUNA_ADMOB_APP_ID }}
          LUNA_ADMOB_REWARDED_ID: ${{ secrets.LUNA_ADMOB_REWARDED_ID }}
        run: |
          if [ -n "$LUNA_ADMOB_APP_ID" ] && [ -n "$LUNA_ADMOB_REWARDED_ID" ]; then
            echo "Release build shows real AdMob ads"
          else
            echo "::warning::LUNA_ADMOB_APP_ID / LUNA_ADMOB_REWARDED_ID not set: the release build shows Google test ads"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Check the bundle
        continue-on-error: true
        run: |
          # what Google Play will read from the bundle: version, SDK levels, permissions, size, signature, native code
          AAB=app/build/outputs/bundle/release/app-release.aab
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          bt() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" --xpath "$1" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//'; }
          VC=$(bt /manifest/@android:versionCode); VN=$(bt /manifest/@android:versionName)
          MIN=$(bt /manifest/uses-sdk/@android:minSdkVersion); TGT=$(bt /manifest/uses-sdk/@android:targetSdkVersion)
          PERMS=$(bt /manifest/uses-permission/@android:name)
          KB=$(( $(stat -c %s "$AAB") / 1024 ))
          SIGNER=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'Owner:' | sed 's/^Owner: //'); SIGNER=${SIGNER:-sin firmar}
          LIBS=$(unzip -l "$AAB" | grep -c '/lib/.*\.so$' || true)
          MSG="Version $VN (code $VC), minSdk $MIN, targetSdk $TGT, $KB KB, permissions: ${PERMS:-none}, signed by: $SIGNER, native libraries: $LIBS"
          echo "::notice title=Bundle for Google Play::$MSG"
          echo "### Bundle for Google Play" >> "$GITHUB_STEP_SUMMARY"; echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: luna-apk-prueba
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luna-google-play
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/*.apk
